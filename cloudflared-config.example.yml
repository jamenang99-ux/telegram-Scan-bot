# ============================================================
# Cloudflare NAMED Tunnel config template
# ------------------------------------------------------------
# Copy this to: C:\Users\USer\.cloudflared\config.yml
# AFTER running `cloudflared tunnel create scan-bot`
# (which gives you the TUNNEL_ID and writes credentials-file).
#
# A Named Tunnel gives a STABLE public URL that never changes
# across restarts (unlike quick tunnels: *.trycloudflare.com).
# ============================================================

# The Tunnel UUID from `cloudflared tunnel create scan-bot`
tunnel: REPLACE_WITH_TUNNEL_ID

# Auto-written by `cloudflared tunnel create` (same folder)
credentials-file: C:\Users\USer\.cloudflared\REPLACE_WITH_TUNNEL_ID.json

ingress:
  # Public hostname you chose via `cloudflared tunnel route dns scan-bot scan`
  # -> becomes https://scan.YOURDOMAIN.com  (no warning interstitial)
  - hostname: scan.YOURDOMAIN.com
    service: http://localhost:3001

  # Catch-all: anything else returns 404
  - service: http_status:404
